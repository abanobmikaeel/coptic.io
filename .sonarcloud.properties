# Read by SonarCloud automatic analysis (the PR "SonarCloud Code Analysis" check).
# sonar-project.properties is only read by the CI scanner in sonarqube.yml.

sonar.sources=apps,packages,scripts
sonar.exclusions=**/node_modules/**,**/.next/**,**/dist/**,**/dist-workers/**,**/coverage/**,**/*.json,**/*.min.js,apps/web/public/**

# Benchmarks deliberately evaluate and discard expressions; analyse them as tests
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,apps/web/e2e/**,**/__benchmarks__/**

# One-off importers share parsing scaffolding by design; duplication there is not a product smell
sonar.cpd.exclusions=**/__tests__/**,**/__benchmarks__/**,apps/web/e2e/**,scripts/**,packages/data/scripts/**

# Local dev tooling only: git hooks resolve git/pnpm from the developer's PATH, and the
# data importers read paths the developer passes on the command line. Neither ships.
sonar.issue.ignore.multicriteria=hooksPath,importPath,importTmp
sonar.issue.ignore.multicriteria.hooksPath.ruleKey=typescript:S4036
sonar.issue.ignore.multicriteria.hooksPath.resourceKey=scripts/**/*
sonar.issue.ignore.multicriteria.importPath.ruleKey=tssecurity:S8707
sonar.issue.ignore.multicriteria.importPath.resourceKey=packages/data/scripts/**/*
sonar.issue.ignore.multicriteria.importTmp.ruleKey=typescript:S5443
sonar.issue.ignore.multicriteria.importTmp.resourceKey=packages/data/scripts/**/*
