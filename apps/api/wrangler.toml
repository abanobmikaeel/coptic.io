name = "coptic-api"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]
account_id = "20136227a8ea87137c4e806e90ba1ccf"

workers_dev = true

routes = [
  { pattern = "api.coptic.io", custom_domain = true }
]

[define]
# Injected as a compile-time constant so esbuild tree-shakes the Bun dev
# dynamic-import fallback out of the Workers bundle entirely.
IS_WORKERS = "true"

[vars]

[[r2_buckets]]
binding = "BIBLE_BUCKET"
bucket_name = "coptic-io-readings"

# Usage analytics (see src/analytics). Production only: not inherited by [env.preview],
# so PR previews record nothing. The dataset is created on the first write.
[[analytics_engine_datasets]]
binding = "ANALYTICS"
dataset = "coptic_api_requests"

# Email subscriptions database. AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY and
# SES_SNS_TOPIC_ARNS (topics allowed to call the SES webhook) are secrets.
[[d1_databases]]
binding = "SUBSCRIPTIONS_DB"
database_name = "coptic-subscriptions"
database_id = "26d44062-68d3-40c4-be8d-ffa9cca2ca4b"
migrations_dir = "migrations"

# Daily readings email.
[triggers]
crons = ["0 11 * * *"]

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1

# PR previews (`--env preview --name coptic-api-pr-N`). Routes are inherited from the top
# level, so clear them: otherwise every preview deploy moves api.coptic.io off production,
# and deleting the preview deletes the domain. Bindings and `define` are not inherited.
[env.preview]
routes = []

# Previews have no subscriptions database, so they must not send the daily email.
[env.preview.triggers]
crons = []

[env.preview.vars]

[env.preview.define]
IS_WORKERS = "true"

[[env.preview.r2_buckets]]
binding = "BIBLE_BUCKET"
bucket_name = "coptic-io-readings"
